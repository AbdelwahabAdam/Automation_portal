{# Building blocks used by the email templates #}
{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 26px 0;">
  <tr>
    <td align="center" bgcolor="#4a2d7f" style="border-radius: 8px;">
      <a href="{{ url }}" target="_blank" style="display: inline-block; padding: 14px 34px; font-family: Tahoma, 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; color: #ffffff; text-decoration: none; border-radius: 8px;">{{ label }}</a>
    </td>
  </tr>
</table>
{% endmacro %}
{% macro note(text) %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 22px 0 0;">
  <tr>
    <td bgcolor="#f4f1fa" style="padding: 12px 16px; border-right: 4px solid #2aa7c9; border-radius: 6px; font-family: Tahoma, 'Segoe UI', Arial, sans-serif; font-size: 13px; line-height: 1.8; color: #4b5563;">{{ text }}</td>
  </tr>
</table>
{% endmacro %}
