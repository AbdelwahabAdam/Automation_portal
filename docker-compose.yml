services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev
      POSTGRES_DB: portal
    ports:
      - "5433:5432"
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the portal sends during development; read them at http://localhost:8026
  mail:
    image: mailhog/mailhog
    ports:
      - "1026:1025"
      - "8026:8025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal_dev@db:5432/portal
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5174}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-FutureLife Portal <no-reply@futurelife.local>}
      DAFTRA_SUBDOMAIN: ${DAFTRA_SUBDOMAIN:-}
      DAFTRA_API_KEY: ${DAFTRA_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8001
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  portal_db:
  backend_uploads:
