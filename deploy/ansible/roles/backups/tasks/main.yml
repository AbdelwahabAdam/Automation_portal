- name: Folder for the backups
  ansible.builtin.file:
    path: "{{ portal_backup_dir }}"
    state: directory
    mode: "0700"

- name: Backup script (database dump + uploaded files)
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/portal-backup
    mode: "0700"

- name: Back up every night at 02:30
  ansible.builtin.cron:
    name: portal backup
    minute: "30"
    hour: "2"
    job: /usr/local/bin/portal-backup >> /var/log/portal-backup.log 2>&1
