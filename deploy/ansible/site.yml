# Set up the server and deploy (or update) the portal. Run again after every push to deploy it:
#   ansible-playbook site.yml --ask-vault-pass
- name: FutureLife portal
  hosts: portal
  become: true
  # Tags let one part run on its own, e.g. --tags pipeline (which does not restart the portal)
  roles:
    - {role: base, tags: base}
    - {role: docker, tags: docker}
    - {role: portal, tags: portal}
    - {role: pipeline, tags: pipeline}
    - {role: backups, tags: backups}
    - {role: sync, tags: sync}
