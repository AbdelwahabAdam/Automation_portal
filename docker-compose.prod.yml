# The portal on a server: docker compose -f docker-compose.prod.yml up -d --build
# Settings come from .env next to this file (written by deploy/ansible). Only the web server is reachable
# from outside; the database and the backend are on the compose network only.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portal
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # Set by portal-deploy; empty when built by hand, which then reads as a development build
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_BUILD: ${APP_BUILD:-0}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    restart: unless-stopped
    # Behind Caddy: take the visitor's address from X-Forwarded-For, for the activity log
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      DAFTRA_SUBDOMAIN: ${DAFTRA_SUBDOMAIN:-}
      DAFTRA_API_KEY: ${DAFTRA_API_KEY:-}
      DAFTRA_SEND_PAYMENT_PROOF: ${DAFTRA_SEND_PAYMENT_PROOF:-false}
    volumes:
      - backend_uploads:/app/uploads
      # Files the import commands read (deploy/ansible/import.yml copies them here)
      - ./imports:/imports:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  portal_db:
  backend_uploads:
